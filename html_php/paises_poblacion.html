<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gráfico de Población por País</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    canvas { max-width: 700px; margin: auto; }
  </style>
</head>
<body>

  <h2>🌍 Población por País (en millones)</h2>

  <canvas id="graficoPaises"></canvas>

  <script>
    const ctx = document.getElementById('graficoPaises').getContext('2d');
    const grafico = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['China', 'India', 'Estados Unidos', 'Indonesia', 'Brasil', 'Pakistán', 'Nigeria'],
        datasets: [{
          label: 'Población (millones)',
          data: [1412, 1393, 331, 273, 213, 225, 206],
          backgroundColor: 'rgba(54, 162, 235, 0.7)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: function(value) {
                return value + 'M';
              }
            }
          }
        },
        plugins: {
          title: {
            display: true,
            text: 'Población de los países más poblados (aprox.)'
          }
        }
      }
    });
  </script>

</body>
</html>
