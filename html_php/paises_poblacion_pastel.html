<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gráfico de Pastel - Población por País</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    canvas { max-width: 600px; margin: auto; display: block; }
  </style>
</head>
<body>

  <h2>🌎 Participación de la Población Mundial por País</h2>

  <canvas id="graficoPastel"></canvas>

  <script>
    const ctx = document.getElementById('graficoPastel').getContext('2d');
    const grafico = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: ['China', 'India', 'Estados Unidos', 'Indonesia', 'Brasil', 'Pakistán', 'Nigeria'],
        datasets: [{
          label: 'Población (millones)',
          data: [1412, 1393, 331, 273, 213, 225, 206],
          backgroundColor: [
            '#FF6384', '#36A2EB', '#FFCE56',
            '#4BC0C0', '#9966FF', '#FF9F40', '#00C49F'
          ]
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: 'Población de los países más poblados (en millones)'
          },
          legend: {
            position: 'bottom'
          }
        }
      }
    });
  </script>

</body>
</html>
